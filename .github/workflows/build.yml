name: PlatformIO Build ClassicESP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ClassicESP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          APP_VERSION="$(tr -d '\r\n' < version)"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${APP_VERSION}" == *alpha* || "${APP_VERSION}" == *beta* || "${APP_VERSION}" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO - ClassicESP
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            .ccache
          key: pio-ClassicESP-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-ClassicESP-

      - name: Install PlatformIO + esptool + ccache
        run: |
          sudo apt update
          sudo apt install ccache
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Build ClassicESP
        run: |
          ENVS="esp32-wled-esp32-ota-quinled-rgbw"
          CMD="pio run -j 2"
          for env in $ENVS; do
            CMD="$CMD -e $env"
          done
          eval "$CMD"

      - name: Upload Artifacts - ClassicESP
        uses: actions/upload-artifact@v7
        with:
          name: Hyperk-Firmware-ClassicESP
          path: release/
          if-no-files-found: error

      - name: Generate Job Summary
        run: |
          echo "**Boards:** esp32-wled-esp32-ota-quinled-rgbw" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: Hyperk-Firmware-ClassicESP
          path: release

      - name: Publish firmware release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.app_version }}
          name: Hyperk ${{ needs.build.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
